name: Tests

# Runs on every PR into the refactor branch or main, and on pushes to them,
# so a PR shows green or red before it is pulled onto the dev server.
on:
  pull_request:
    branches: [refactor/refactor, main]
  push:
    branches: [refactor/refactor, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gmp, bcmath, intl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Audit dependencies
        run: |
          composer audit --no-interaction || echo "::warning::composer audit reported issues"
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported issues"
